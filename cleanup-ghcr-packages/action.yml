---
name: Cleanup GHCR Packages
description: Automated retention and cleanup policy for GitHub Container Registry packages.
inputs:
  package-names:
    description: Comma-separated or JSON list of package names (or 'auto')
    required: false
    default: auto
  repository-owner:
    description: Repository or package owner
    required: false
    default: ${{ github.repository_owner }}
  token:
    description: GitHub Token with packages write permission
    required: false
    default: ${{ github.token }}
  keep-sha-count:
    description: Number of recent commit SHA versions to retain
    required: false
    default: '5'
  untagged-retention-days:
    description: Number of days to retain unreferenced untagged versions (grace period)
    required: false
    default: '7'
  dry-run:
    description: Run without actually deleting versions
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_PACKAGE_NAMES: ${{ inputs.package-names }}
        INPUT_REPOSITORY_OWNER: ${{ inputs.repository-owner }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        INPUT_KEEP_SHA_COUNT: ${{ inputs.keep-sha-count }}
        INPUT_UNTAGGED_RETENTION_DAYS: ${{ inputs.untagged-retention-days }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run --with pygithub python3 "${{ github.action_path }}/cleanup.py"
        else
          pip install --quiet --break-system-packages pygithub 2>/dev/null || pip install --quiet pygithub
          python3 "${{ github.action_path }}/cleanup.py"
        fi
