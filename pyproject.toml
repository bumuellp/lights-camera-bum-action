[project]
name = "lights-camera-bum-action"
version = "1.3.0"
description = "Shared reusable GitHub Actions and workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygithub>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
