[project]
name = "lights-camera-bum-action"
version = "1.0.0"
description = "Shared reusable GitHub Actions and workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygithub>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
