---
name: Pre-Commit Validation & Testing
description: >-
  Run pre-commit hooks natively with cached hook environments, mise tool
  support, and optional lint-tools container fallback.
inputs:
  extra-args:
    description: Additional arguments to pass to pre-commit run.
    required: false
    default: '--all-files'
  tools:
    description: Optional mise tool specs to install (e.g. 'trivy@0.75.0').
    required: false
    default: ''
  cache:
    description: Whether to cache pre-commit, hook envs, mise tools, and Trivy DB.
    required: false
    default: 'true'
  pre-commit-version:
    description: Pinned pre-commit version for native execution.
    required: false
    # renovate: datasource=pypi depName=pre-commit
    default: '4.7.0'
  use-container:
    description: Fall back to running inside lint-tools container instead of natively.
    required: false
    default: 'false'
  container-image:
    description: Container image used when use-container is 'true'.
    required: false
    default: >-
      ghcr.io/bumuellp/lint-tools:v1.4.1@sha256:3a6e02e1f03750890b4cc984e516c9552f71049829c751616b3ccb9791b02a46
runs:
  using: 'composite'
  steps:
    - name: Cache Pre-Commit Python Venv
      if: inputs.use-container != 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.local/share/pre-commit-venv
        key: precommit-venv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pre-commit-version }}

    - name: Setup Pre-Commit Environment
      if: inputs.use-container != 'true'
      shell: bash
      env:
        PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      run: bash "$GITHUB_ACTION_PATH/setup_pre_commit.sh"

    - name: Cache Pre-Commit Hook Environments
      if: inputs.use-container != 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.cache/pre-commit
        key: precommit-envs-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          precommit-envs-${{ runner.os }}-

    - name: Cache Mise & Installed Tools
      if: inputs.use-container != 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: |
          ~/.local/bin/mise
          ~/.local/share/mise
          ~/.config/mise/config.toml
        key: >-
          precommit-mise-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.pre-commit-config.yaml', 'mise.toml', '.mise.toml', '.tool-versions') }}
        restore-keys: |
          precommit-mise-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Trivy Vulnerability DB
      if: inputs.use-container != 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          trivy-db-${{ runner.os }}-${{ runner.arch }}-

    - name: Setup Mise & Project Tools
      if: inputs.use-container != 'true'
      shell: bash
      env:
        REQUIRED_TOOLS: ${{ inputs.tools }}
      run: bash "$GITHUB_ACTION_PATH/install_mise_tools.sh"

    - name: Run Pre-Commit Hooks (Native)
      if: inputs.use-container != 'true'
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "$GITHUB_ACTION_PATH/run_pre_commit.sh"

    - name: Run Pre-Commit Hooks (Container Fallback)
      if: inputs.use-container == 'true'
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.extra-args }}
        CONTAINER_IMAGE: ${{ inputs.container-image }}
      run: bash "$GITHUB_ACTION_PATH/run_container.sh"
