---
name: Pre-Commit Validation & Testing
description: Run containerized pre-commit hooks, linters, and tests across all files using ghcr.io/bumuellp/lint-tools.
inputs:
  extra-args:
    description: Additional arguments to pass to pre-commit run.
    required: false
    default: '--all-files'
runs:
  using: 'composite'
  steps:
    - name: Run Lint Tools Container
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          -u "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e PRE_COMMIT_HOME=/tmp/pre-commit \
          ghcr.io/bumuellp/lint-tools:latest \
          sh -c 'git config --global --add safe.directory "*" && pre-commit run ${{ inputs.extra-args }}'
