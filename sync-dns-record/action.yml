---
name: Sync DNS Record
description: Provider-agnostic DNS record manager supporting deSEC.io, IONOS, and Hetzner DNS APIs.
inputs:
  provider:
    description: DNS provider ('desec', 'ionos', or 'hetzner').
    required: false
    default: 'desec'
  token:
    description: API authentication token (deSEC Token or IONOS API Key).
    required: true
  domain:
    description: Registered zone / domain name (e.g. example.dedyn.io or example.com).
    required: true
  subname:
    description: Subdomain label (e.g. 'mc' for mc.example.com, or '' / '@' for apex).
    required: false
    default: ''
  type:
    description: DNS record type (e.g. A, AAAA, TXT, CNAME).
    required: false
    default: 'A'
  records:
    description: Space-separated, comma-separated, or single record values (e.g. '1.2.3.4').
    required: false
    default: ''
  ttl:
    description: DNS record Time To Live in seconds.
    required: false
    default: '60'
  action:
    description: Action to perform ('sync' or 'delete').
    required: false
    default: 'sync'
runs:
  using: composite
  steps:
    - name: Cache hcloud CLI
      id: cache-hcloud
      if: inputs.provider == 'hetzner'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.local/bin/hcloud
        key: hcloud-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/action.yml', github.action_path)) }}

    - name: Ensure hcloud CLI in PATH
      shell: bash
      if: inputs.provider == 'hetzner'
      env:
        # renovate: datasource=github-releases depName=hetznercloud/cli
        HCLOUD_URL: "https://github.com/hetznercloud/cli/releases/download/v1.70.2/hcloud-linux-amd64.tar.gz"
      run: |
        mkdir -p "$HOME/.local/bin"
        if [ ! -f "$HOME/.local/bin/hcloud" ] && ! command -v hcloud >/dev/null 2>&1; then
          echo "Downloading hcloud CLI..."
          ARCH="${{ runner.arch }}"
          [ "$ARCH" = "X64" ] && ARCH="amd64"
          [ "$ARCH" = "ARM64" ] && ARCH="arm64"
          DL_URL="${HCLOUD_URL//amd64/$ARCH}"
          curl -fsSL "$DL_URL" | tar -xz -C "$HOME/.local/bin" hcloud
          chmod +x "$HOME/.local/bin/hcloud"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - shell: bash
      env:
        DNS_PROVIDER: ${{ inputs.provider }}
        DNS_TOKEN: ${{ inputs.token }}
        DNS_DOMAIN: ${{ inputs.domain }}
        DNS_SUBNAME: ${{ inputs.subname }}
        DNS_TYPE: ${{ inputs.type }}
        DNS_RECORDS: ${{ inputs.records }}
        DNS_TTL: ${{ inputs.ttl }}
        DNS_ACTION: ${{ inputs.action }}
      run: bash "$GITHUB_ACTION_PATH/sync.sh"
