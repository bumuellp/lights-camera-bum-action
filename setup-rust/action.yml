---
name: Setup Rust Toolchain
description: Standardized Rust setup with rustup toolchain, optional components (clippy, rustfmt), targets, and Swatinem/rust-cache.
inputs:
  toolchain:
    description: Rust toolchain version (e.g. 'stable', 'nightly', '1.85.0').
    required: false
    default: 'stable'
  components:
    description: Comma-separated components to install (e.g. 'clippy, rustfmt').
    required: false
    default: 'clippy, rustfmt'
  targets:
    description: Comma-separated compilation targets to add (e.g. 'wasm32-unknown-unknown').
    required: false
    default: ''
  cache:
    description: Whether to enable Swatinem/rust-cache ('true' or 'false').
    required: false
    default: 'true'
  workspaces:
    description: Space-delimited workspace or crate paths for caching (e.g. 'integrations/discord-bot').
    required: false
    default: ''
  install-worker-build:
    description: Whether to install worker-build for Cloudflare Workers ('true' or 'false').
    required: false
    default: 'false'
  run-fmt:
    description: Whether to run 'cargo fmt --check' across configured workspaces ('true' or 'false').
    required: false
    default: 'false'
  run-clippy:
    description: Whether to run 'cargo clippy' across configured workspaces ('true' or 'false').
    required: false
    default: 'false'
  clippy-args:
    description: Arguments passed to cargo clippy when run-clippy is 'true'.
    required: false
    default: '--all-targets -- -D warnings'
  run-test:
    description: Whether to run 'cargo test' across configured workspaces ('true' or 'false').
    required: false
    default: 'false'
  test-args:
    description: Optional additional arguments passed to cargo test when run-test is 'true'.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Rust Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}

    - name: Install worker-build
      if: inputs.install-worker-build == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install_worker_build.sh"

    - name: Run Rust Quality Checks (fmt / clippy / test)
      if: inputs.run-fmt == 'true' || inputs.run-clippy == 'true' || inputs.run-test == 'true'
      shell: bash
      env:
        WORKSPACES: ${{ inputs.workspaces }}
        RUN_FMT: ${{ inputs.run-fmt }}
        RUN_CLIPPY: ${{ inputs.run-clippy }}
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
        RUN_TEST: ${{ inputs.run-test }}
        TEST_ARGS: ${{ inputs.test-args }}
      run: bash "$GITHUB_ACTION_PATH/run_checks.sh"
