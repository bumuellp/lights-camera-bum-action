---
name: Run Authorized SSH Script
description: Pipe environment payload to a remote authorized deploy script over SSH.
inputs:
  ssh-user:
    description: Remote SSH username.
    required: true
  ssh-host:
    description: Remote SSH host.
    required: true
  ssh-port:
    description: Optional remote SSH port.
    required: false
    default: ''
  ssh-key-path:
    description: Path to the private SSH key file on the runner.
    required: false
    default: /runner_ssh_key
  env-payload:
    description: Environment payload to pipe into the remote script.
    required: false
    default: ''
  remote-command:
    description: Remote command to execute over SSH.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        ENV_PAYLOAD: ${{ inputs.env-payload }}
        REMOTE_COMMAND: ${{ inputs.remote-command }}
      run: bash "${{ github.action_path }}/exec.sh"
