---
name: Deploy Cloudflare Worker
description: Build and deploy serverless Cloudflare Workers using Wrangler CLI with automated secret provisioning.
inputs:
  api-token:
    description: Cloudflare API token with Workers:Edit permissions.
    required: true
  working-directory:
    description: Working directory containing wrangler.toml.
    required: false
    default: '.'
  environment:
    description: Optional Cloudflare environment specified in wrangler.toml (e.g. 'production', 'staging').
    required: false
    default: ''
  worker-name:
    description: Optional Worker name override (defaults to name in wrangler config).
    required: false
    default: ''
  vars:
    description: Optional multiline or comma-separated list of environment variable names to pass as --var to wrangler deploy.
    required: false
    default: ''
  secrets:
    description: Optional multiline or comma-separated list of secret names available in env to provision via wrangler secret bulk.
    required: false
    default: ''
  cache:
    description: Whether to cache npm/wrangler CLI packages across workflow runs ('true' or 'false').
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Cache Wrangler npm Packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: wrangler-npm-${{ runner.os }}-${{ runner.arch }}

    - name: Deploy Worker via Wrangler
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        WORKER_NAME: ${{ inputs.worker-name }}
        WORKER_ENV: ${{ inputs.environment }}
        WORKER_VARS: ${{ inputs.vars }}
        WORKER_SECRETS: ${{ inputs.secrets }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh"
