---
name: Build and Push GHCR Image
description: Set up Buildx, log in to GHCR, and build a Docker/OCI image with GitHub Actions caching.
inputs:
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Dockerfile path.
    required: true
  image-name:
    description: Image name under the GHCR namespace.
    required: true
  repository-owner:
    description: GitHub repository owner used in the image tag.
    required: true
  sha:
    description: Commit SHA tag for the pushed image.
    required: true
  username:
    description: GHCR username.
    required: true
  password:
    description: GHCR password or token.
    required: true
  extra-tags:
    description: Additional comma- or newline-separated tags (e.g. v1, v1.0.0).
    required: false
    default: ''
  registry:
    description: Container registry host.
    required: false
    default: ghcr.io
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4.1.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Compute Image Tags
      id: meta
      shell: bash
      run: |
        TAGS="$("${{ github.action_path }}/compute_tags.sh" \
          "${{ inputs.registry }}" \
          "${{ inputs.repository-owner }}" \
          "${{ inputs.image-name }}" \
          "${{ inputs.sha }}" \
          "${{ inputs.extra-tags }}")"
        {
          echo "tags<<EOF"
          echo "$TAGS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and Push Image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha,scope=${{ inputs.image-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
