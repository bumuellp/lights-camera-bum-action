---
name: Reusable Deploy Images

'on':
  workflow_call:
    inputs:
      images:
        description: JSON array of image configurations or 'auto' for directory discovery
        required: false
        type: string
        default: auto
      target:
        description: Target image name to rebuild on dispatch, 'all', or 'auto' for diff
        required: false
        type: string
        default: auto
      scan-with-trivy:
        description: Whether to scan built images with Trivy
        required: false
        type: boolean
        default: true
      extra-tags:
        description: Comma- or newline-separated extra tags (e.g. 'v1, v1.0.0')
        required: false
        type: string
        default: ''
      registry:
        description: Container registry host
        required: false
        type: string
        default: ghcr.io
    secrets:
      registry-token:
        description: GitHub token or PAT with packages write permission
        required: true

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan Image Builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should-build: ${{ steps.plan.outputs.should-build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan Builds
        id: plan
        uses: bumuellp/lights-camera-bum-action/plan-image-builds@v1
        with:
          images: ${{ inputs.images }}
          target: ${{ inputs.target }}

  build-and-push:
    name: Build ${{ matrix.image-name }}
    needs: plan
    if: ${{ needs.plan.outputs.should-build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Image Locally
        uses: bumuellp/lights-camera-bum-action/build-ghcr-image@v1
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          image-name: ${{ matrix.image-name }}
          repository-owner: ${{ github.repository_owner }}
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token }}
          extra-tags: >-
            ${{ matrix.extra-tags || inputs.extra-tags || (github.ref_type == 'tag' && format('{0}, v1', github.ref_name) || '') }}
          push: false
          load: true
          registry: ${{ inputs.registry }}

      - name: Cache Trivy Vulnerability DB
        if: ${{ inputs.scan-with-trivy }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-cache-${{ runner.os }}
          restore-keys: |
            trivy-db-cache-${{ runner.os }}-

      - name: Scan Built Image with Trivy
        if: ${{ inputs.scan-with-trivy }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: '${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.image-name }}:${{ github.sha }}'
          trivy-config: trivy.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Image to GHCR
        uses: bumuellp/lights-camera-bum-action/build-ghcr-image@v1
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          image-name: ${{ matrix.image-name }}
          repository-owner: ${{ github.repository_owner }}
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token }}
          extra-tags: >-
            ${{ matrix.extra-tags || inputs.extra-tags || (github.ref_type == 'tag' && format('{0}, v1', github.ref_name) || '') }}
          push: true
          load: false
          registry: ${{ inputs.registry }}

  cleanup:
    name: Cleanup Stale Packages
    needs: [plan, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Run Retention Cleanup
        uses: bumuellp/lights-camera-bum-action/cleanup-ghcr-packages@v1
        with:
          package-names: ${{ inputs.images }}
          repository-owner: ${{ github.repository_owner }}
          token: ${{ secrets.registry-token }}
          keep-sha-count: '5'
