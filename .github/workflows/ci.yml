---
name: CI

'on':
  workflow_call:
    inputs:
      extra-args:
        description: 'Additional arguments to pass to pre-commit run.'
        required: false
        type: string
        default: '--all-files'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-Commit & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Pre-Commit via Shared Action
        uses: bumuellp/lights-camera-bum-action/pre-commit@ac10d6046ee766e3bd5b7d036c4d1aaf5fb71589 # v1
        with:
          extra-args: ${{ inputs.extra-args || '--all-files' }}
